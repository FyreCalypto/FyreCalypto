<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Ultraviolet fork</title>
  <desc id="desc">Titanium Network’s browser proxy. The illustration traces requests from a browser through a service worker to the web.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#1b1742"/>
      <stop offset=".57" stop-color="#13102b"/>
      <stop offset="1" stop-color="#0d142e"/>
    </linearGradient>
    <linearGradient id="rim" x2="1" y2="1">
      <stop stop-color="#5af2f7"/>
      <stop offset=".49" stop-color="#a791ff"/>
      <stop offset="1" stop-color="#5c4b9d"/>
    </linearGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#5af2f7" opacity=".3"/>
    </pattern>
  </defs>

  <path d="M14 1H406L419 14V186L406 199H14L1 186V14Z" fill="url(#surface)" stroke="url(#rim)" stroke-width="2"/>
  <path d="M14 1H123L115 6H9Z" fill="#5af2f7"/>
  <path d="M298 14h101l7 7v55H298z" fill="url(#dots)"/>
