    <text x="24" y="81" fill="#d7c9f4" font-size="12">Fork of Titanium Network’s proxy</text>
  </g>
  <text x="22" y="63" fill="#f5f6ff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="33" font-weight="800" letter-spacing="-.9">Ultraviolet</text>

  <rect x="22" y="98" width="376" height="80" rx="8" fill="#100e25" stroke="#413971"/>
  <path d="M22 111h376" stroke="#413971"/>
  <g fill="#9d96ef">
    <circle cx="32" cy="105" r="1.5"/><circle cx="38" cy="105" r="1.5"/><circle cx="44" cy="105" r="1.5"/>
  </g>

