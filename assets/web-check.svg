<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Web Check mirror</title>
  <desc id="desc">Alicia Sykes’s site diagnostics toolkit. The illustrated console shows DNS, TLS, and HTTP header diagnostics.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#24123f"/>
      <stop offset=".58" stop-color="#120b26"/>
      <stop offset="1" stop-color="#100923"/>
    </linearGradient>
    <linearGradient id="rim" x2="1" y2="1">
      <stop stop-color="#ff65c8"/>
      <stop offset=".46" stop-color="#986adc"/>
      <stop offset="1" stop-color="#574081"/>
    </linearGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#ff65c8" opacity=".28"/>
    </pattern>
  </defs>

  <path d="M14 1H406L419 14V186L406 199H14L1 186V14Z" fill="url(#surface)" stroke="url(#rim)" stroke-width="2"/>
  <path d="M14 1H123L115 6H9Z" fill="#ff65c8"/>
