    <text x="24" y="81" fill="#d7c9f4" font-size="12">Mirror of Alicia Sykes’s toolkit</text>
  </g>
  <text x="22" y="63" fill="#fff5fc" font-family="'Inter', 'Segoe UI', sans-serif" font-size="33" font-weight="800" letter-spacing="-.9">Web Check</text>

  <rect x="22" y="98" width="376" height="80" rx="8" fill="#100a1e" stroke="#51366c"/>
  <path d="M22 111h376" stroke="#51366c"/>
  <g fill="#bf8ded">
    <circle cx="32" cy="105" r="1.5"/><circle cx="38" cy="105" r="1.5"/><circle cx="44" cy="105" r="1.5"/>
  </g>
  <path d="M147 122v45m126-45v45" fill="none" stroke="#3a2858"/>

