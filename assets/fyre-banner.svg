<svg xmlns="http://www.w3.org/2000/svg" width="920" height="294" viewBox="0 0 920 294" role="img" aria-labelledby="title desc">
  <title id="title">FyreCalypto</title>
  <desc id="desc">Browser games and web experiments. A terminal window with an ember-colored flame.</desc>
  <defs>
    <linearGradient id="shell" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#13141c"/>
      <stop offset=".55" stop-color="#18151c"/>
      <stop offset="1" stop-color="#2f191c"/>
    </linearGradient>
    <linearGradient id="ember" x2="1" y2="1">
      <stop stop-color="#ffe0a1"/>
      <stop offset=".46" stop-color="#ff9b65"/>
      <stop offset="1" stop-color="#fa536d"/>
    </linearGradient>
    <radialGradient id="heat">
      <stop stop-color="#ff5f59" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ff5f59" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#fba181" opacity=".18"/>
    </pattern>
    <clipPath id="window">
      <rect x="1" y="1" width="918" height="292" rx="19"/>
    </clipPath>
    <style>
      .spark { animation: drift 4.5s ease-in-out infinite; }
      .later { animation-delay: -2.2s; }
      .cursor { animation: breathe 2.8s ease-in-out infinite; }
      @keyframes drift {
        0%, 100% { transform: translateY(0); opacity: .55; }
        50% { transform: translateY(-8px); opacity: 1; }
      }
      @keyframes breathe {
        50% { opacity: .32; }
      }
      @media (prefers-reduced-motion: reduce) {
        .spark, .cursor { animation: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#window)">
    <rect width="920" height="294" fill="url(#shell)"/>
    <ellipse cx="744" cy="167" rx="221" ry="160" fill="url(#heat)"/>
    <rect x="568" y="47" width="352" height="247" fill="url(#dots)"/>
    <path d="M568 47v247" stroke="#ac6557" opacity=".20"/>
    <rect width="920" height="47" fill="#15151d"/>
    <path d="M0 47h920" stroke="#403039"/>
    <circle cx="25" cy="24" r="4" fill="#fa667b"/>
    <circle cx="40" cy="24" r="4" fill="#ff9b65"/>
    <circle cx="55" cy="24" r="4" fill="#ffd88e"/>
    <g font-family="Consolas, 'Liberation Mono', monospace">
      <text x="76" y="30" font-size="15" fill="#d2c0c8">~/github</text>
      <text x="885" y="30" text-anchor="end" font-size="14" letter-spacing="2" fill="#c5a8b3">PROFILE.EXE</text>
      <text x="42" y="105" font-size="20" font-weight="700" fill="#ffb57d">$ whoami</text>
      <text x="42" y="219" font-size="24" letter-spacing="-.4" fill="#f0dce4">Browser games &amp; web experiments</text>
      <rect class="cursor" x="43" y="249" width="19" height="4" rx="2" fill="#ff8a75"/>
    </g>
    <text x="37" y="177" fill="url(#ember)" font-family="Segoe UI, system-ui, sans-serif" font-size="78" font-weight="800" letter-spacing="-3.5">FyreCalypto</text>
    <g transform="translate(744 169)">
      <circle r="95" fill="none" stroke="#e28b76" stroke-opacity=".28" stroke-dasharray="3 7"/>
      <circle r="75" fill="#1a1118" fill-opacity=".65" stroke="#bf6157" stroke-opacity=".55"/>
      <circle r="61" fill="none" stroke="#ff9a78" stroke-opacity=".13"/>
      <path d="M-111 0h27m168 0h27M0-110v20m0 180v20" fill="none" stroke="#ee957a" stroke-opacity=".57"/>
      <path d="M-50-63a80 80 0 0 1 60-16m65 49a80 80 0 0 1 4 42m-51 62a80 80 0 0 1-60-1" fill="none" stroke="#ff9876" stroke-opacity=".63" stroke-width="2" stroke-linecap="round"/>
      <path d="M8-56c5 25-17 33-13 53 9-5 14-13 15-23C29-12 43 4 43 23c0 22-17 37-42 37-24 0-42-16-42-38 0-18 9-33 24-47-2 11 0 17 4 21 2-24 13-34 21-52z" fill="url(#ember)"/>
      <path d="M2 12c4 13-10 17-10 28 0 8 4 14 10 18 12-3 19-10 19-20 0-10-8-19-19-26z" fill="#311921" opacity=".88"/>
      <circle cx="95" cy="0" r="4" fill="#ffc18b"/>
      <circle cx="-95" cy="0" r="3" fill="#ff826e"/>
    </g>
    <g fill="#ffd09b">
      <path class="spark" d="M824 87l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
      <path class="spark later" d="M654 224l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
      <circle class="spark" cx="848" cy="219" r="2"/>
      <circle class="spark later" cx="666" cy="106" r="2"/>
    </g>
  </g>
  <rect x="1" y="1" width="918" height="292" rx="19" fill="none" stroke="#70423f" stroke-width="2"/>
</svg>
