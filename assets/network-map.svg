<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="title desc">
  <title id="title">FyreCalypto · Cybersecurity and networking</title>
  <desc id="desc">A cyan packet travels from a client through an amber gateway to a server.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0c1928"/>
      <stop offset=".58" stop-color="#090f1b"/>
      <stop offset="1" stop-color="#071b22"/>
    </linearGradient>
    <linearGradient id="title-ink" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".65" stop-color="#e6f7ff"/>
      <stop offset="1" stop-color="#97bacf"/>
    </linearGradient>
    <linearGradient id="route-ink">
      <stop stop-color="#27a9dc"/>
      <stop offset=".52" stop-color="#75f6de"/>
      <stop offset="1" stop-color="#29caaf"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#2be6cb" stop-opacity=".20"/>
      <stop offset="1" stop-color="#2be6cb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#365465" stroke-opacity=".29"/>
    </pattern>
    <clipPath id="outline">
      <path d="M21 1H932L959 28V318L938 339H28L1 312V22Z"/>
    </clipPath>
    <style>
      .packet { animation: forward 5.8s ease-in-out infinite; }
      .echo { animation: forward 5.8s ease-in-out -2.9s infinite; }
      @keyframes forward {
        0% { transform: translate(583px, 142px); opacity: 0; }
        8% { opacity: 1; }
        43% { transform: translate(711px, 142px); opacity: 1; }
        50% { transform: translate(711px, 142px); opacity: .2; }
        57% { transform: translate(711px, 142px); opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translate(845px, 142px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .packet, .echo { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#outline)">
    <rect width="960" height="340" fill="url(#background)"/>
    <rect x="494" width="466" height="340" fill="url(#grid)"/>
    <ellipse cx="721" cy="164" rx="239" ry="167" fill="url(#halo)"/>
    <path d="M494 0V340M0 65H494M0 274H960" fill="none" stroke="#243e50"/>
    <path d="M0 65H114M494 274H591M871 274H960" fill="none" stroke="#4bd6ca" stroke-opacity=".64"/>

    <g font-family="Consolas, 'Liberation Mono', monospace">
      <path d="M48 37h10m-5-5v10" fill="none" stroke="#64f1d5" stroke-width="2" stroke-linecap="round"/>
      <text x="69" y="43" font-size="17" fill="#8eafc4">github.com/<tspan fill="#d0eff7">FyreCalypto</tspan></text>
      <text x="47" y="229" font-size="24" fill="#76f2d9">Cybersecurity &amp; Networking</text>
      <g font-size="17" font-weight="700" fill="#c5e2ef">
        <text x="63" y="313">DNS</text>
        <text x="143" y="313">TCP/IP</text>
        <text x="256" y="313">TLS</text>
      </g>
      <g fill="#63ddcc">
        <circle cx="49" cy="307" r="3"/>
        <circle cx="129" cy="307" r="3"/>
        <circle cx="242" cy="307" r="3"/>
      </g>
    </g>
    <text x="40" y="178" fill="url(#title-ink)" font-family="'Segoe UI', system-ui, sans-serif" font-size="73" font-weight="800" letter-spacing="-3.6">FyreCalypto</text>

    <g fill="none">
      <path d="M545 109V65H589M883 65H922V109M545 235v26h44m294 0h39v-26" stroke="#497384"/>
      <circle cx="711" cy="147" r="74" stroke="#4da8a7" stroke-opacity=".28" stroke-dasharray="2 6"/>
      <circle cx="711" cy="147" r="88" stroke="#518c92" stroke-opacity=".20"/>
      <path d="M583 142H845" stroke="#265764" stroke-width="7"/>
      <path d="M583 142H845" stroke="url(#route-ink)" stroke-width="2"/>
      <path d="M641 138l5 4-5 4m129-8 5 4-5 4" stroke="#a3faef" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g fill="#a1fff0">
      <g class="packet" transform="translate(660 142)">
        <circle r="10" opacity=".20"/>
        <circle r="4.5"/>
      </g>
      <g class="echo" transform="translate(791 142)">
        <circle r="8" opacity=".18"/>
        <circle r="3.5"/>
      </g>
    </g>

    <g>
      <rect x="547" y="111" width="72" height="63" rx="10" fill="#0e2434" stroke="#42a7c9" stroke-width="1.5"/>
      <g fill="none" stroke="#8bdbfa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="568" y="130" width="30" height="20" rx="2"/>
        <path d="M577 156h12m-6-6v6m-10-20 4 4-4 4m8 0h5"/>
      </g>
      <rect x="675" y="111" width="72" height="63" rx="10" fill="#2a211b" stroke="#e7ae58" stroke-width="1.5"/>
      <g fill="none" stroke="#ffd287" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M711 126c5 4 10 6 15 6v9c0 10-7 16-15 20-8-4-15-10-15-20v-9c5 0 10-2 15-6z"/>
        <path d="m705 143 4 4 8-8"/>
      </g>
      <rect x="809" y="111" width="72" height="63" rx="10" fill="#0d282e" stroke="#50c4a9" stroke-width="1.5"/>
      <g fill="none" stroke="#8af4d5" stroke-width="2.4" stroke-linecap="round">
        <rect x="830" y="130" width="30" height="11" rx="2"/>
        <rect x="830" y="145" width="30" height="11" rx="2"/>
        <path d="M835 135.5h1m-1 15h1m7-15h11m-11 15h11"/>
      </g>
    </g>

    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" text-anchor="middle">
      <text x="583" y="213" fill="#a9e4ff">Client</text>
      <text x="711" y="213" fill="#ffd287">Gateway</text>
      <text x="845" y="213" fill="#a8f4dd">Server</text>
    </g>

    <g transform="translate(787 298)">
      <rect width="105" height="17" rx="4" fill="#101e29" stroke="#2b4b54"/>
      <path d="M10 5v7m10-7v7m10-7v7m10-7v7m10-7v7m10-7v7m10-7v7m10-7v7m10-7v7" stroke="#417f88" stroke-width="2" stroke-linecap="round"/>
      <circle cx="123" cy="8.5" r="4" fill="#76e9c6"/>
    </g>
  </g>
  <path d="M21 1H932L959 28V318L938 339H28L1 312V22Z" fill="none" stroke="#35566b" stroke-width="2"/>
</svg>
