<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">FyreCalypto · Cybersecurity and Networking</title>
  <desc id="desc">A purple and pink cyber arcade. A pixel-art packet gremlin watches glowing network traffic while terminal messages cycle.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1">
      <stop stop-color="#120923"/>
      <stop offset=".58" stop-color="#251341"/>
      <stop offset="1" stop-color="#102542"/>
    </linearGradient>
    <linearGradient id="spectrum">
      <stop stop-color="#ff65c8"/>
      <stop offset=".48" stop-color="#a791ff"/>
      <stop offset="1" stop-color="#5af2f7"/>
    </linearGradient>
    <linearGradient id="headline" x2="0" y2="1">
      <stop stop-color="#fff9ff"/>
      <stop offset=".65" stop-color="#e6c8ff"/>
      <stop offset="1" stop-color="#e580fb"/>
    </linearGradient>
    <linearGradient id="planet" x2="0" y2="1">
      <stop stop-color="#ff75c9"/>
      <stop offset=".57" stop-color="#7e48da"/>
      <stop offset="1" stop-color="#252053"/>
    </linearGradient>
    <radialGradient id="bloom">
      <stop stop-color="#e742ff" stop-opacity=".37"/>
      <stop offset="1" stop-color="#e742ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#e0a5ff" opacity=".23"/>
    </pattern>
    <pattern id="scan" width="4" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0h4" stroke="#150d2d" stroke-opacity=".46" stroke-width="1.2"/>
    </pattern>
    <clipPath id="frame">
      <path d="M25 1H934L959 26V334L934 359H25L1 335V25Z"/>
    </clipPath>
    <clipPath id="sun">
      <circle cx="762" cy="171" r="103"/>
    </clipPath>
    <style>
      .message { opacity: 0; animation: type 12s linear infinite; }
      .first { opacity: 1; animation-delay: 0s; }
      .second { animation-delay: -8s; }
      .third { animation-delay: -4s; }
      .packet { animation: travel 4.6s linear infinite; }
      .packet.next { animation-delay: -2.3s; }
      .gremlin { animation: float 3.8s ease-in-out infinite; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .star.late { animation-delay: -1.5s; }
      @keyframes type {
        0% { opacity: 1; clip-path: inset(0 100% 0 0); }
        11% { opacity: 1; clip-path: inset(0); animation-timing-function: linear; }
        29% { opacity: 1; clip-path: inset(0); }
        33%, 100% { opacity: 0; clip-path: inset(0); }
      }
      @keyframes travel {
        0% { transform: translate(592px, 276px); opacity: 0; }
        10%, 90% { opacity: 1; }
        100% { transform: translate(907px, 276px); opacity: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes twinkle { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) {
        .message, .packet, .gremlin, .star { animation: none; }
        .first { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="360" fill="url(#night)"/>
    <rect width="960" height="360" fill="url(#dots)"/>
    <ellipse cx="752" cy="173" rx="251" ry="204" fill="url(#bloom)"/>
    <path d="M0 44C147 1 271 27 408 50S727 85 960 12V0H0Z" fill="url(#spectrum)" opacity=".22"/>
    <path d="M0 47C147 4 271 30 408 53S727 88 960 15" fill="none" stroke="url(#spectrum)" stroke-width="1.5" opacity=".62"/>
    <path d="M0 325C157 278 274 315 410 332s317 30 550-44v72H0Z" fill="url(#spectrum)" opacity=".17"/>
    <path d="M0 324C157 277 274 314 410 331s317 30 550-44" fill="none" stroke="url(#spectrum)" stroke-width="1.6" opacity=".69"/>
    <path d="M0 336h128l15-15h93l12 12h163m511-278h-65l-11 11h-62" fill="none" stroke="#c58bf5" opacity=".35"/>
    <g fill="none" stroke="#ad76ef" opacity=".25">
      <path d="M577 258h355m-355 16h355m-355 21h355m-355 28h355"/>
      <path d="M703 245l-85 115m111-115-43 115m69-115 4 115m23-115 53 115m-26-115 100 115"/>
    </g>

    <circle cx="762" cy="171" r="119" fill="none" stroke="#bf8fff" stroke-width="1.3" stroke-dasharray="3 8" opacity=".51"/>
    <circle cx="762" cy="171" r="103" fill="url(#planet)" opacity=".85"/>
    <g clip-path="url(#sun)" fill="#160d31">
      <path d="M650 177h225v4H650zm0 13h225v5H650zm0 16h225v6H650zm0 19h225v8H650zm0 23h225v10H650zm0 26h225v11H650z" opacity=".71"/>
    </g>
    <path d="M593 103h51m237 85h41M600 229h39m234-112h36" stroke="#b48ce7" opacity=".37"/>
    <g fill="#ffd479">
      <path class="star" d="M620 95l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
      <path class="star late" d="M893 133l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
      <circle cx="632" cy="211" r="2.5"/>
      <circle cx="859" cy="78" r="2.5"/>
      <circle cx="908" cy="215" r="2"/>
    </g>
    <g fill="#5af2f7">
      <path class="star late" d="M879 92h3v5h5v3h-5v5h-3v-5h-5v-3h5z"/>
      <path class="star" d="M603 199h3v5h5v3h-5v5h-3v-5h-5v-3h5z"/>
    </g>

    <g transform="translate(648 77) scale(7.25)" shape-rendering="crispEdges">
      <g class="gremlin">
        <!-- Original sprite: antenna, hood, headset, face and paws. -->
        <path d="M8 0h2v2h2v2h3v2h2V4h3V2h2V0h2v3h2v4h2v5h2v8h-2v3h-3v3H7v-3H4v-3H2v-8h2V7h2V3h2z" fill="#0e0822" stroke="#1d0c39" stroke-width="1.6"/>
        <path d="M8 2h2v2h2v2h3v2h2V6h3V4h2V2h2v4h2v4h2v5h-3v-3h-3v-2H10v2H7v3H4v-5h2V6h2z" fill="#7e4ac9"/>
        <path d="M8 3h2v2h2v2h3v2H9v2H7V7h1zm14 0h2v4h1v4h-2V9h-6V7h3V5h2z" fill="#e5a2ff"/>
        <path d="M8 5h2v2h2v2H8zm15 0v4h-4V7h2V5z" fill="#ff72cc"/>
        <path d="M9 11h3v-1h8v1h3v2h2v8h-3v2H10v-2H7v-8h2z" fill="#2a194b"/>
        <path d="M10 13h3v-1h6v1h3v2h1v4h-2v2H11v-2H9v-4h1z" fill="#100923"/>
        <path d="M10 15h4v3h-4zm8 0h4v3h-4z" fill="#5af2f7"/>
        <path d="M18 15h4v3h-4z" fill="#ff77ce"/>
        <path d="M15 18h2v1h-2zm-1 2h1v1h2v-1h1v2h-4z" fill="#eac2ff"/>
        <path d="M5 13h2v6H5zm20 0h2v6h-2z" fill="#ffd479"/>
        <path d="M3 14h2v4H3zm24 0h2v4h-2z" fill="#ff9d76"/>
        <path d="M7 22h5v2h8v-2h5v3h-2v2H9v-2H7z" fill="#8854d2"/>
        <path d="M10 23h2v2h-2zm10 0h2v2h-2z" fill="#e3acfa"/>
        <path d="M24 21h3v-2h2v3h-2v1h-3z" fill="#63edf5"/>
      </g>
    </g>

    <path d="M588 276h320" stroke="#5af2f7" stroke-width="2" opacity=".64"/>
    <path d="M590 276h45l10 10h38m132 0h41l10-10h40" fill="none" stroke="#ff65c8" opacity=".58"/>
    <g fill="#5af2f7">
      <circle cx="590" cy="276" r="3"/>
      <circle cx="908" cy="276" r="3"/>
      <g class="packet" transform="translate(703 276)">
        <rect x="-10" y="-7" width="20" height="14" rx="6" opacity=".22"/>
        <rect x="-6" y="-2.5" width="12" height="5" rx="2.5"/>
      </g>
      <g class="packet next" transform="translate(829 276)">
        <rect x="-10" y="-7" width="20" height="14" rx="6" opacity=".22"/>
        <rect x="-6" y="-2.5" width="12" height="5" rx="2.5"/>
      </g>
    </g>
    <text x="758" y="305" text-anchor="middle" fill="#eacbff" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">PACKET GREMLIN</text>

    <g font-family="Consolas, 'Liberation Mono', monospace">
      <rect x="42" y="77" width="359" height="39" rx="10" fill="#281538" stroke="#a466bc"/>
      <circle cx="62" cy="96.5" r="4" fill="#ffd479"/>
      <text x="78" y="103" fill="#ffd3f2" font-size="19" font-weight="700" letter-spacing="1">CYBERSECURITY / NETWORKING</text>
      <rect x="42" y="229" width="478" height="58" rx="12" fill="#100923" fill-opacity=".9" stroke="#865dab"/>
      <text x="61" y="264" fill="#ff91d7" font-size="26" font-weight="700">&gt;</text>
      <g fill="#78f5f8" font-size="24" font-weight="700">
        <text x="92" y="264" class="message first">follow the packet_</text>
        <text x="92" y="264" class="message second" opacity="0">inspect the handshake_</text>
        <text x="92" y="264" class="message third" opacity="0">read the headers_</text>
      </g>
    </g>
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="850" letter-spacing="-4.3">
      <text x="45" y="197" fill="#ec50c2" opacity=".65">FyreCalypto</text>
      <text x="42" y="193" fill="url(#headline)">FyreCalypto</text>
    </g>
    <rect width="960" height="360" fill="url(#scan)" pointer-events="none"/>
  </g>
  <path d="M25 1H934L959 26V334L934 359H25L1 335V25Z" fill="none" stroke="url(#spectrum)" stroke-width="2"/>
</svg>
