<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img" aria-labelledby="title desc">
  <title id="title">Hall Pass System</title>
  <desc id="desc">A browser prototype for scheduling hall passes and tracking arrivals. The illustration shows the two steps in a stylized app window.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#271644"/>
      <stop offset=".5" stop-color="#16102c"/>
      <stop offset="1" stop-color="#0e152c"/>
    </linearGradient>
    <linearGradient id="rim" x2="1" y2="1">
      <stop stop-color="#ffd479"/>
      <stop offset=".48" stop-color="#ad84ed"/>
      <stop offset="1" stop-color="#5771a2"/>
    </linearGradient>
    <linearGradient id="title-ink" x2="0" y2="1">
      <stop stop-color="#fff9ee"/>
      <stop offset="1" stop-color="#ffd799"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#a791ff" opacity=".3"/>
    </pattern>
    <clipPath id="card">
      <path d="M17 1H703L719 17V193L703 209H17L1 193V17Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="720" height="210" fill="url(#surface)"/>
    <path d="M381 0h339v210H347z" fill="url(#dots)"/>
    <path d="M405 188h-38l-13-13h-35m340-153h15l13 13h19m-34 151h16l14-14h18" fill="none" stroke="#c392ff" stroke-opacity=".45" stroke-width="1.5"/>
    <circle cx="319" cy="175" r="2.5" fill="#ff9ada"/>
    <circle cx="659" cy="22" r="2.5" fill="#a791ff"/>
    <path d="M17 1H163l-8 5H11Z" fill="#ffd479"/>
  </g>
  <path d="M17 1H703L719 17V193L703 209H17L1 193V17Z" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <g font-family="'IBM Plex Mono', Consolas, monospace">
    <text x="30" y="51" fill="#ffd479" font-size="14" font-weight="700" letter-spacing="1.3">BROWSER PROTOTYPE</text>
    <text x="30" y="128" fill="#e1d3f8" font-size="15">Schedule passes and track arrivals.</text>
  </g>
  <text x="27" y="100" fill="url(#title-ink)" font-family="'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="800" letter-spacing="-1.5">Hall Pass System</text>
  <path d="M30 153h94m7 0h12m7 0h6" fill="none" stroke="#b490ed" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>

  <g transform="translate(391 40)">
    <rect width="294" height="130" rx="10" fill="#100d24" stroke="#695297"/>
    <path d="M0 23h294" stroke="#534175"/>
    <g fill="#a791ff">
      <circle cx="13" cy="12" r="2"/><circle cx="21" cy="12" r="2"/><circle cx="29" cy="12" r="2"/>
    </g>
    <path d="M245 12h30" stroke="#564474" stroke-width="3" stroke-linecap="round"/>
    <rect x="11" y="35" width="116" height="82" rx="7" fill="#1c1632" stroke="#7054a0"/>
    <rect x="167" y="35" width="116" height="82" rx="7" fill="#12253a" stroke="#4e7a9c"/>
    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#c6b3ff">
        <rect x="55" y="49" width="28" height="28" rx="3"/>
        <path d="M55 57h28m-20-12v8m12-8v8m-11 13h10m-5-5v10"/>
      </g>
      <path d="M136 72h22m-6-5 6 5-6 5" stroke="#ffd479"/>
