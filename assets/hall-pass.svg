        <path d="M225 47l13 5v9c0 8-5 13-13 17-8-4-13-9-13-17v-9Z"/>
        <path d="m219 62 4 4 8-8"/>
      </g>
    </g>
    <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">
      <text x="69" y="102" fill="#dfd1ff">Schedule pass</text>
      <text x="225" y="102" fill="#a8f8f5">Track arrival</text>
    </g>
  </g>
